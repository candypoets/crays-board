appId: life.crays.board
---
# Events vertical slice: seed the staff signer and venue through the dev-only
# deep link, open Events, assert the seeded event and its RSVP counts project
# from relay truth (EVENT-01/EVENT-08), then create "QA Event <awardIdPrefix>"
# through the three-step wizard with a double-tap on Publish (EVENT-04
# idempotency — verify-events.mjs asserts exactly one created 31923).
# Requires env from .qa/relay-screen-scenario.mjs: RELAY_URL, SERVICE_URL,
# QA_NSEC, AWARD_ID_PREFIX (reused as the per-run title suffix).
- runFlow: launch.yaml
- openLink: "craysboard://qa-seed?relay=${RELAY_URL}&service=${SERVICE_URL}&nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "orders-screen"
    timeout: 60000
# Navigate to the Events destination.
- openLink: "craysboard://events"
- extendedWaitUntil:
    visible:
      id: "events-screen"
    timeout: 60000
# Seeded event projects with its RSVP counts (accepted=2 -> "2 going").
- extendedWaitUntil:
    visible:
      text: "QA Seed Event"
    timeout: 45000
- assertVisible:
    text: "QA Seed Event"
- assertVisible:
    text: "2 going"
# Detail panel: schedule/location/capacity/RSVP rows and the check-in placeholder.
- tapOn:
    text: "QA Seed Event"
- extendedWaitUntil:
    visible:
      id: "event-detail-panel"
    timeout: 15000
- assertVisible:
    id: "event-detail-schedule"
- assertVisible:
    id: "event-detail-capacity"
- assertVisible:
    id: "event-detail-rsvp-accepted"
- assertVisible:
    id: "event-detail-rsvp-tentative"
- assertVisible:
    id: "event-detail-rsvp-declined"
# The check-in action lives in the detail panel header (always on screen);
# the scrollable rows below may overflow on compact viewports.
- assertVisible:
    id: "event-checkin-button"
- takeScreenshot: 30-events-detail
- tapOn:
    id: "event-detail-close"
# Create flow, step 1: details.
- tapOn:
    id: "event-create-button"
- extendedWaitUntil:
    visible:
      id: "event-create-screen"
    timeout: 15000
- assertVisible:
    id: "event-create-step-details"
- tapOn:
    id: "event-field-title"
- inputText: "QA Event ${AWARD_ID_PREFIX}"
- tapOn:
    id: "event-field-summary"
- inputText: "Created by the events QA flow."
- hideKeyboard
- tapOn:
    id: "event-category-gathering"
- tapOn:
    id: "event-create-continue"
# Step 2: schedule.
- extendedWaitUntil:
    visible:
      id: "event-create-step-schedule"
    timeout: 15000
- tapOn:
    id: "event-field-date"
- inputText: "2027-01-15"
- hideKeyboard
- tapOn:
    id: "event-field-start"
- inputText: "18:00"
- hideKeyboard
- tapOn:
    id: "event-field-end"
- inputText: "20:00"
- hideKeyboard
- tapOn:
    id: "event-field-capacity"
- inputText: "40"
- hideKeyboard
- tapOn:
    id: "event-create-continue"
# Step 3: admission (open & free) + publish. The deliberate double-tap must
# still produce exactly one kind 31923 (proved by verify-events.mjs).
- extendedWaitUntil:
    visible:
      id: "event-create-step-admission"
    timeout: 15000
- assertVisible:
    id: "event-admission-open"
- doubleTapOn:
    id: "event-publish-button"
# Publish returns to the list only after relay acknowledgement; the created
# event then projects from relay truth.
- extendedWaitUntil:
    visible:
      id: "events-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "QA Event ${AWARD_ID_PREFIX}"
    timeout: 60000
- assertVisible:
    text: "QA Seed Event"
- takeScreenshot: 30-events-created
