appId: life.crays.board
---
# Menu vertical slice: seed the staff signer and venue through the dev-only
# deep link (lands on Orders), open the Menu destination, prove the sectioned
# catalog projection with the foreign-publisher read-only state, toggle one
# item's availability (same addressable d, pending until ack), and edit one
# item's name through the editor. Relay truth is verified independently by
# .qa/verify-menu.mjs. Requires env from .qa/relay-screen-scenario.mjs:
# RELAY_URL, SERVICE_URL, QA_NSEC.
#
# Reachability: sections order Drinks before Mains (position tie breaks
# alphabetically), so Mains items sit below the fold on a landscape tablet.
# Instead of scrolling, the flow uses the section filter chips (also MENU-01
# filter coverage) to bring each target row on screen deterministically
# before asserting or interacting with it.
- runFlow: launch.yaml
- openLink: "craysboard://qa-seed?relay=${RELAY_URL}&service=${SERVICE_URL}&nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "orders-screen"
    timeout: 60000
# MENU-01: the sectioned catalog projects from kind 30009 definitions.
- openLink: "craysboard://menu"
- extendedWaitUntil:
    visible:
      id: "menu-screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "menu-item-qa-menu-espresso"
    timeout: 45000
- takeScreenshot: 20-menu-catalog
# Drinks filter: brings the foreign row on screen deterministically.
- tapOn:
    id: "menu-chip-drinks"
- extendedWaitUntil:
    visible:
      id: "menu-item-qa-menu-foreign"
    timeout: 15000
- assertVisible:
    id: "menu-item-qa-menu-foreign"
# MENU-05: the foreign-publisher item is visible but non-editable. The row's
# top registers as visible while the note inside it is still below the fold
# (two Drinks items don't shrink the list enough), so scroll the note itself
# into view before asserting it.
- scrollUntilVisible:
    element:
      id: "menu-foreign-note-qa-menu-foreign"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "menu-foreign-note-qa-menu-foreign"
- assertNotVisible:
    id: "menu-edit-qa-menu-foreign"
- assertNotVisible:
    id: "menu-availability-toggle-qa-menu-foreign"
# MENU-06: availability toggle republishes the same d; pending until ack.
# Scrolling to the foreign note pushed the espresso row's toggle off-screen,
# so scroll it back into view before tapping.
- scrollUntilVisible:
    element:
      id: "menu-availability-toggle-qa-menu-espresso"
    direction: UP
    timeout: 30000
- tapOn:
    id: "menu-availability-toggle-qa-menu-espresso"
- extendedWaitUntil:
    visible:
      text: "Unavailable"
      childOf:
        id: "menu-item-qa-menu-espresso"
    timeout: 20000
- assertVisible:
    text: "Unavailable"
    childOf:
      id: "menu-item-qa-menu-espresso"
- takeScreenshot: 20-menu-toggled
# MENU-04: the editor republishes the same d with the new name. The Mains
# filter brings the soup row on screen before tapping its Edit control.
- tapOn:
    id: "menu-chip-mains"
- extendedWaitUntil:
    visible:
      id: "menu-item-qa-menu-soup"
    timeout: 15000
- assertVisible:
    id: "menu-item-qa-menu-soup"
- tapOn:
    id: "menu-edit-qa-menu-soup"
- extendedWaitUntil:
    visible:
      id: "menu-editor"
    timeout: 15000
- tapOn:
    id: "menu-field-name"
- eraseText: 60
- inputText: "QA Roasted tomato soup"
- hideKeyboard
# The actions live at the end of the editor's scroll content (see menu.tsx
# comment). scrollUntilVisible swipes from screen center — over the list
# column on the tablet master-detail layout — so swipe explicitly inside the
# right-hand editor column to bring the save button into view.
- swipe:
    start: "84%, 85%"
    end: "84%, 35%"
- extendedWaitUntil:
    visible:
      id: "menu-save-button"
    timeout: 60000
- tapOn:
    id: "menu-save-button"
# The Mains filter is still active, so the renamed row is on screen.
- extendedWaitUntil:
    visible:
      text: "QA Roasted tomato soup"
    timeout: 20000
- assertVisible:
    text: "QA Roasted tomato soup"
    childOf:
      id: "menu-item-qa-menu-soup"
- takeScreenshot: 20-menu-edited
