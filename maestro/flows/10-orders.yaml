appId: life.crays.board
---
# Orders vertical slice: seed the staff signer and venue through the dev-only
# deep link, double-tap Accept on the pending order (ORDER-05 idempotency),
# then relaunch through the same deep link and prove the Accepted state comes
# back from relay truth without another tap (relaunch rule).
# Requires env from .qa/relay-screen-scenario.mjs: RELAY_URL, SERVICE_URL,
# QA_NSEC, AWARD_ID, AWARD_ID_PREFIX, ITEM_ADDRESS, USER_PUBKEY.
- runFlow: launch.yaml
- openLink: "craysboard://qa-seed?relay=${RELAY_URL}&service=${SERVICE_URL}&nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "orders-screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "order-card-${AWARD_ID_PREFIX}"
    timeout: 30000
- assertVisible:
    id: "order-card-${AWARD_ID_PREFIX}"
# ORDER-05: a deliberate double-tap must still produce exactly one 37237
# (proved by verify-order-accepted.mjs asserting exactly one status event).
- doubleTapOn:
    id: "order-accept-button"
- extendedWaitUntil:
    visible:
      text: "Accepted"
    timeout: 15000
- assertVisible:
    id: "order-card-${AWARD_ID_PREFIX}"
- assertVisible:
    text: "Accepted"
    childOf:
      id: "order-card-${AWARD_ID_PREFIX}"
- takeScreenshot: 10-orders-accepted
# Relaunch rule: stop the app and re-enter through the same qa-seed deep link
# (identity + venue restore from SecureStore; qa-seed reinstalls). The card
# must show "Accepted" from relay truth without any further tap. After stopApp
# the dev client returns to its launcher, so re-enter the bundle via the
# "Recently opened" localhost:8090 row before opening the deep link.
- stopApp
- launchApp
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - tapOn:
          text: "http://localhost:8090"
- extendedWaitUntil:
    visible: "Crays Board"
    timeout: 120000
- openLink: "craysboard://qa-seed?relay=${RELAY_URL}&service=${SERVICE_URL}&nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "orders-screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "order-card-${AWARD_ID_PREFIX}"
    timeout: 45000
- extendedWaitUntil:
    visible:
      text: "Accepted"
    timeout: 45000
- assertVisible:
    id: "order-card-${AWARD_ID_PREFIX}"
- assertVisible:
    text: "Accepted"
- assertNotVisible:
    text: "New"
- takeScreenshot: 10-orders-relaunched-accepted
