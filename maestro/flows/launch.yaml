appId: life.crays.board
---
# Shared setup: launch the development client, connect it to Metro on 8090,
# and wait for the Crays Board bundle. Port 8090 is Board-specific (8085
# belongs to the crays-rn dev server); keep Metro out of CI mode so discovery
# and fresh-bundle behavior match the known-good crays-rn setup.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Development Build"
    timeout: 30000
- runFlow:
    when:
      visible: "New development server"
    commands:
      - tapOn: "New development server"
- extendedWaitUntil:
    visible: "(exp|http)://"
    timeout: 20000
- tapOn: "(exp|http)://"
- inputText: "exp://localhost:8090"
- hideKeyboard
- tapOn: "Connect"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    text: "Close"
    optional: true
# First bundle after a cold Metro start can take minutes; keep this generous.
- extendedWaitUntil:
    visible: "Crays Board"
    timeout: 180000
