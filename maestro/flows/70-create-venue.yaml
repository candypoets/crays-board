appId: life.crays.board
---
# Create Venue happy path (CREATE-01…06): from cold welcome through the
# four-step wizard to real provisioning and the success surface. See
# docs/screens/create-venue.md. Bespoke runner .qa/qa-create-venue.mjs —
# there is no pre-existing relay; the app provisions it against the real
# coordinator. Requires env from the runner:
#   QA_VENUE_NAME  unique venue name for the run ("QA Venue <run>")
#   QA_NSEC        staff account nsec (imported in step 3, never logged)
- runFlow: launch.yaml
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 60000
- tapOn:
    id: "create-venue-button"
- extendedWaitUntil:
    visible:
      id: "create-venue-screen"
    timeout: 30000

# Step 1 — Identity: name drives the derived slug and the live guest preview.
- tapOn:
    id: "cv-name-input"
- inputText: "${QA_VENUE_NAME}"
- hideKeyboard
- assertVisible:
    id: "cv-slug"
- tapOn:
    id: "cv-description-input"
- inputText: "QA venue for the Crays Board create-venue scenario."
- hideKeyboard
- tapOn:
    id: "cv-continue"

# Step 2 — Place: device-suggested timezone is kept; address/hours optional.
- assertVisible:
    id: "cv-timezone-input"
- tapOn:
    id: "cv-continue"

# Step 3 — Service & owner: import the staff account, then acknowledge
# recovery (the acknowledgement gates Continue).
- tapOn:
    id: "cv-import-account-button"
- tapOn:
    id: "cv-nsec-input"
- inputText: "${QA_NSEC}"
- hideKeyboard
- tapOn:
    id: "cv-import-confirm-button"
- extendedWaitUntil:
    visible:
      id: "cv-account-created"
    timeout: 30000
- tapOn:
    id: "cv-owner-name-input"
- inputText: "QA Owner"
- hideKeyboard
- tapOn:
    id: "cv-recovery-checkbox"
- tapOn:
    id: "cv-continue"

# Step 4 — Review: exact summary, then one deliberate Create venue action.
- assertVisible:
    id: "cv-review"
# The review row renders name + slug as one node ("<name> · @<slug>"), and
# Maestro text matching is exact — use a regex.
- assertVisible:
    text: ".*${QA_VENUE_NAME}.*"
- tapOn:
    id: "cv-submit"

# Provisioning allocates a real relay and publishes the venue profile; this
# can take a couple of minutes on a cold coordinator.
- extendedWaitUntil:
    visible:
      id: "create-venue-provisioning"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "create-venue-success-screen"
    timeout: 300000
- assertVisible: "Venue created"
- takeScreenshot: 70-create-venue-success
- tapOn:
    id: "cv-open-venue-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
- takeScreenshot: 70-create-venue-home
