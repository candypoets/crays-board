appId: life.crays.board
---
# Orders full ladder: three seeded implicit-pending awards against one product
# — advance (Accept → Start preparing → Mark ready → Serve), decline
# (double-tap Decline, no confirmation), cancel (Accept, then Cancel order
# through the confirmation dialog, with a dismissal first). The active queue
# is oldest-first (bootstrap spaces award created_at by one second), so the
# target card is always the first active card (`index: 0`); terminal cards
# sort to the end and offer no actions.
# Requires env from .qa/relay-screen-scenario.mjs: RELAY_URL, SERVICE_URL,
# QA_NSEC, AWARD_ID, AWARD_ID_PREFIX, ITEM_ADDRESS, USER_PUBKEY.
- runFlow: launch.yaml
- openLink: "craysboard://qa-seed?relay=${RELAY_URL}&service=${SERVICE_URL}&nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "orders-screen"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "order-card-${AWARD_ID_PREFIX}"
    timeout: 30000
- assertVisible:
    id: "order-card-${AWARD_ID_PREFIX}"
# Award 1 (advance): the full §6.2 ladder, one valid next action per card.
- tapOn:
    id: "order-action-button"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Accepted"
    timeout: 15000
- tapOn:
    id: "order-action-button"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Preparing"
    timeout: 15000
- tapOn:
    id: "order-action-button"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Ready"
    timeout: 15000
- tapOn:
    id: "order-action-button"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Served"
    timeout: 15000
- takeScreenshot: 11-orders-ladder-advance-served
# Award 2 (decline): pending cards offer Decline with no confirmation. The
# deliberate double-tap must still publish at most one cancelled status
# (ORDER-12; verify-order-ladder.mjs asserts exactly one).
- doubleTapOn:
    id: "order-decline-button"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Declined"
    timeout: 15000
- takeScreenshot: 11-orders-ladder-declined
# Award 3 (cancel): the only pending card left. Accept it, then cancel through
# the confirmation dialog naming the order and venue (ORDER-07). Dismissing
# the dialog first proves a dismissal publishes nothing.
- tapOn:
    id: "order-action-button"
    index: 0
- extendedWaitUntil:
    visible:
      text: "Accepted"
    timeout: 15000
- tapOn:
    id: "order-cancel-button"
- extendedWaitUntil:
    visible:
      text: "Cancel this order?"
    timeout: 10000
- assertVisible:
    text: "Keep order"
- tapOn:
    text: "Keep order"
- extendedWaitUntil:
    notVisible:
      text: "Cancel this order?"
    timeout: 10000
- tapOn:
    id: "order-cancel-button"
- extendedWaitUntil:
    visible:
      text: "Yes, cancel order"
    timeout: 10000
- takeScreenshot: 11-orders-ladder-cancel-dialog
- tapOn:
    text: "Yes, cancel order"
- extendedWaitUntil:
    visible:
      text: "Cancelled"
    timeout: 15000
- takeScreenshot: 11-orders-ladder-final
# All three orders are terminal: no card offers any action.
- assertNotVisible:
    id: "order-action-button"
- assertNotVisible:
    id: "order-cancel-button"
- assertNotVisible:
    id: "order-decline-button"
