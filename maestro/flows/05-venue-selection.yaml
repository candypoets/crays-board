appId: life.crays.board
---
# Venue selection slice: seed the staff signer and venue through the dev-only
# deep link, land on Orders, open venue selection through the shell venue chip,
# and verify the ENTRY-04 surface with its honest access check.
# Requires env from .qa/relay-screen-scenario.mjs: RELAY_URL, SERVICE_URL,
# QA_NSEC, AWARD_ID, AWARD_ID_PREFIX, ITEM_ADDRESS, USER_PUBKEY.
- runFlow: launch.yaml
- openLink: "craysboard://qa-seed?relay=${RELAY_URL}&service=${SERVICE_URL}&nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "orders-screen"
    timeout: 60000
- tapOn:
    id: "venue-chip"
- extendedWaitUntil:
    visible:
      id: "venue-selection-screen"
    timeout: 15000
- assertVisible:
    id: "venue-selection-screen"
- assertVisible:
    id: "venue-card"
- assertVisible:
    id: "access-check"
- assertVisible:
    id: "create-another-venue"
- extendedWaitUntil:
    visible:
      text: "Connected"
    timeout: 15000
- tapOn:
    id: "access-refresh"
- extendedWaitUntil:
    visible:
      text: "Connected"
    timeout: 15000
- takeScreenshot: 05-venue-selection
