appId: life.crays.board
---
# Home attention summary (HOME-01/HOME-02/HOME-03): seed the staff signer and
# venue through the dev-only deep link (lands on Orders), navigate to Home
# through the public shell navigation, assert every summary card value against
# the seeded relay truth, prove the new-venue checklist is absent on this
# established venue, then tap the orders card into the Orders destination.
# Independent relay truth is checked by .qa/verify-home.mjs.
# Requires env from .qa/relay-screen-scenario.mjs: RELAY_URL, SERVICE_URL,
# QA_NSEC, AWARD_ID, AWARD_ID_PREFIX, ITEM_ADDRESS, USER_PUBKEY.
- runFlow: launch.yaml
- openLink: "craysboard://qa-seed?relay=${RELAY_URL}&service=${SERVICE_URL}&nsec=${QA_NSEC}"
- extendedWaitUntil:
    visible:
      id: "orders-screen"
    timeout: 60000
# The seed deep link lands on Orders; reach Home through the shell (tablet
# rail on the QA device, phone tab bar as the compact fallback).
- runFlow:
    when:
      visible:
        id: "nav-home"
    commands:
      - tapOn:
          id: "nav-home"
- runFlow:
    when:
      visible:
        id: "tab-home"
    commands:
      - tapOn:
          id: "tab-home"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 60000
# Venue truth and live state (HOME-01).
- extendedWaitUntil:
    visible:
      text: "Live"
    timeout: 30000
- assertVisible:
    id: "home-venue-name"
# Orders summary: 2 pending + 1 accepted = 3 open (from the seeded fixtures).
- extendedWaitUntil:
    visible:
      id: "home-orders-card"
    timeout: 30000
- assertVisible:
    text: "3 open orders"
# The stage line is one node ("New 2 · Accepted 1 · Preparing 0 · Ready 0") —
# Maestro text is exact-match, so match it as a regex.
- assertVisible:
    text: ".*New 2 · Accepted 1.*"
- assertVisible:
    text: ".*Oldest wait.*"
# Tonight's upcoming event with a check-in action. The seeded start is +3h,
# so the day label depends on the run's local time.
- assertVisible:
    id: "home-event-card"
- assertVisible:
    text: "(Tonight|Upcoming|Happening now)"
- assertVisible:
    id: "home-checkin-button"
# Menu and member attention counts.
- assertVisible:
    id: "home-menu-card"
- assertVisible:
    text: "1 item unavailable"
- assertVisible:
    id: "home-members-card"
- assertVisible:
    text: "1 active member"
- assertVisible:
    text: "1 expiring soon"
# HOME-03 admin persona: every quick action visible.
- assertVisible:
    id: "home-action-menu"
- assertVisible:
    id: "home-action-event"
- assertVisible:
    id: "home-action-invite"
- assertVisible:
    id: "home-action-role"
# HOME-02: an established venue never shows the new-venue checklist.
- assertNotVisible:
    id: "home-setup-checklist"
- takeScreenshot: 80-home-summary
# The orders card opens the Orders destination.
- tapOn:
    id: "home-orders-card"
- extendedWaitUntil:
    visible:
      id: "orders-screen"
    timeout: 30000
- takeScreenshot: 80-home-orders-destination
