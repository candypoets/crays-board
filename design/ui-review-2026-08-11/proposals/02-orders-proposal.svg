  <text x="88" y="143" class="ui white bold" font-size="14">Maison Crays</text>
  <text x="88" y="164" class="ui railText small">Open for service</text>
  <path d="M196 143l5 5 5-5" class="stroke" stroke="#CDAFBB"/>

  <g class="ui railText body">
    <path d="M34 230l10-9 10 9v11H47v-7h-6v7h-7Z" class="stroke" stroke="#CDAFBB"/>
