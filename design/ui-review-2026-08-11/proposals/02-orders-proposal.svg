  <rect x="16" y="914" width="200" height="62" rx="15" fill="#241019"/>
  <circle cx="46" cy="945" r="18" fill="#FFE3EA"/>
  <text x="46" y="950" class="ui heavy" fill="#C9063A" font-size="11" text-anchor="middle">MI</text>
  <text x="76" y="940" class="ui white small bold">Mina</text>
  <text x="76" y="959" class="ui railText tiny">Service lead</text>
  <circle cx="196" cy="945" r="3" fill="#167A58"/>

  <!-- Context bar -->
