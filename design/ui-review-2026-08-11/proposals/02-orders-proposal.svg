<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .ui { font-family: Arial, Helvetica, sans-serif; fill: #2B1420; }
      .muted { fill: #735966; }
      .faint { fill: #A58D98; }
      .railText { fill: #F5DDE5; }
      .white { fill: #FFFFFF; }
      .bold { font-weight: 700; }
      .heavy { font-weight: 800; }
      .label { font-size: 14px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 13px; }
      .tiny { font-size: 11px; }
      .stroke { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    </style>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#2B1420" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#FFF7F8"/>
  <rect width="1600" height="32" fill="#160A11"/>
