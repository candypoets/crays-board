  <text x="622" y="650" class="ui muted small">The kitchen sees accepted orders here.</text>

  <!-- Lane: Preparing -->
  <rect x="912" y="276" width="316" height="654" rx="18" fill="#FFF7EF" stroke="#F3DFC8"/>
