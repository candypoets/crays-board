  <text x="1310" y="63" class="ui small bold" text-anchor="end">Dinner service</text>
  <text x="1310" y="82" class="ui muted tiny" text-anchor="end">Maison Crays</text>
  <circle cx="1354" cy="68" r="21" fill="#FFE3EA"/>
