  <text x="1282" y="820" class="ui muted small">Collection stays visible when</text>
  <text x="1282" y="840" class="ui muted small">the first order becomes ready.</text>

  <text x="256" y="966" class="ui faint small">Illustrative service state · actions use 48dp targets and color-independent labels.</text>
</svg>
