  <path d="M1533 20c8-9 18-9 26 0M1538 20c5-5 11-5 16 0" class="stroke" stroke="#FFFFFF"/>
  <rect x="1570" y="9" width="16" height="14" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="1586" y="13" width="3" height="6" rx="1" fill="#FFFFFF"/>

  <!-- Venue rail -->
  <rect x="0" y="32" width="232" height="968" fill="#160A11"/>
