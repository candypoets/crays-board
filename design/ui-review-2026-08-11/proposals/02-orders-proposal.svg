  <rect x="1402" y="46" width="156" height="44" rx="13" fill="#FFFFFF" stroke="#D9BEC8"/>
  <text x="1480" y="73" class="ui label" text-anchor="middle">Order settings</text>

  <!-- Header and controls -->
  <text x="264" y="158" class="ui heavy" font-size="34" letter-spacing="-0.7">Orders</text>
  <text x="264" y="188" class="ui muted body">Keep each ticket moving one confirmed step at a time.</text>

  <rect x="1080" y="130" width="182" height="52" rx="15" fill="#FFFFFF" stroke="#D9BEC8"/>
  <text x="1104" y="162" class="ui label">All service points</text>
