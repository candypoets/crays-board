  <text x="1194" y="390" class="ui heavy" fill="#A94E12" font-size="17" text-anchor="end">12 min</text>
  <text x="946" y="426" class="ui heavy" font-size="19">Roast squash</text>
  <text x="946" y="451" class="ui muted small">3 items · table 3</text>
