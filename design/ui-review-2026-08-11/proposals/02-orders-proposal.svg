  <text x="1558" y="236" class="ui muted small" text-anchor="end">A card moves only after the venue confirms the change.</text>

  <!-- Lane: New -->
  <rect x="256" y="276" width="316" height="654" rx="18" fill="#FFF0F2" stroke="#EEDCE2"/>
