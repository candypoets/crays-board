  <text x="538" y="614" class="ui heavy" fill="#9A5C00" font-size="17" text-anchor="end">8 min</text>
  <text x="290" y="650" class="ui heavy" font-size="19">Beef brisket</text>
  <text x="290" y="675" class="ui muted small">2 items · table 8</text>
  <text x="290" y="700" class="ui muted small">Guest 8f14…</text>
