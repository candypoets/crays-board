  <rect x="934" y="596" width="272" height="84" rx="14" fill="#FFF0E5"/>
  <text x="950" y="626" class="ui bold" fill="#A94E12" font-size="13">Timing</text>
  <text x="950" y="650" class="ui muted small">Amber at 10 min · red at 15 min.</text>

  <!-- Lane: Ready -->
  <rect x="1240" y="276" width="316" height="654" rx="18" fill="#F2FAF6" stroke="#D7EEE4"/>
